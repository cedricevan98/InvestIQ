<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InvestIQ{% endblock %} — Investment Suite</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'calculator/css/style.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="{% url 'calculator:index' %}" class="logo">
      <span class="logo-icon">📈</span>
      <span class="logo-text">InvestIQ</span>
    </a>
    <div class="nav-links">
      <a href="{% url 'calculator:compound' %}">Compound</a>
      <a href="{% url 'calculator:sip' %}">SIP</a>
      <a href="{% url 'calculator:cagr' %}">CAGR</a>
      <a href="{% url 'calculator:roi' %}">ROI</a>
      <a href="{% url 'calculator:emi' %}">EMI</a>
      <a href="{% url 'calculator:swp' %}">SWP</a>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>InvestIQ &mdash; Built with Django &amp; Python &bull; All figures are for educational purposes only.</p>
  </footer>
</body>
</html>
